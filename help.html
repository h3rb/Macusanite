<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Macusanite Help</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="help-window">
    <!--
      The help page is a separate document and, in the desktop application, a
      separate window, so opening it does not replace the vein the reader has
      open. It renders the generated manual from src/lib/helpDoc.js, which is
      the same text that `macusanite docs` prints and the MCP server serves, and
      it requires no access to a vault.
    -->
    <div id="help-root" class="help-root" data-booting="true"></div>
    <noscript>This manual is rendered with JavaScript. Run <code>macusanite docs</code> to print the same text.</noscript>
    <script type="module" src="/src/help.js"></script>
  </body>
</html>
